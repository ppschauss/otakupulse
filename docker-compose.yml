# Reproduzierbarer Production-Stack für OtakuPulse (App + PostgreSQL).
# Ablösung des Unraid-Template-Setups: stoppt vorher die Unraid-verwalteten
# Container `otakupulse-app`/`otakupulse-db` (siehe README), dann:
#   docker compose up -d --build
#
# Secrets werden aus frontend/secrets.env gelesen (NIE committen).
services:
  db:
    image: postgres:16-alpine
    container_name: otakupulse-db
    restart: unless-stopped
    env_file: ./frontend/secrets.env
    volumes:
      - /mnt/cache/appdata/otakupulse/db:/var/lib/postgresql/data
    networks:
      - otakupulse-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./frontend
    container_name: otakupulse-app
    restart: unless-stopped
    # Secrets + optionale NEXT_PUBLIC_*-Variablen (werden beim Start-Build in den
    # Client-Bundle eingebacken). Siehe secrets.env.example.
    env_file: ./frontend/secrets.env
    environment:
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3001:3000'
    volumes:
      # Mediathek als Volume (nicht ins Image gebacken) → gespiegelte Bilder
      # werden sofort ausgeliefert, Image bleibt schlank.
      - /mnt/cache/appdata/otakupulse/frontend/public/media:/app/public/media
    networks:
      - otakupulse-net

  # Enrichment-Worker: spiegelt fortlaufend neue Anime-Cover/Banner lokal und
  # erzeugt deutsche Beschreibungen (Claude Haiku) — inkrementell, alle 3 Min.
  # Greift für JEDEN neuen Anime (Batch- wie On-Demand-Import).
  # Übersetzung läuft nur, wenn ANTHROPIC_API_KEY in secrets.env gesetzt ist.
  enrich:
    build:
      context: ./frontend
    container_name: otakupulse-enrich
    restart: unless-stopped
    env_file: ./frontend/secrets.env
    environment:
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /mnt/cache/appdata/otakupulse/frontend/public/media:/app/public/media
    networks:
      - otakupulse-net
    command:
      - sh
      - -lc
      - >
        while true; do
        npx tsx src/scripts/mirror-images.ts --anime &
        if [ -n "$$ANTHROPIC_API_KEY" ]; then npx tsx src/scripts/translate.ts --anime --studios & fi;
        wait;
        sleep 180;
        done

  # Autoposter: zieht den News-RSS-Feed (intern http://otakupulse-app:3000/feed.xml,
  # kein Cloudflare-Umweg) und postet neue Artikel nach Facebook/Reddit/Bluesky/
  # Mastodon/Discord. Workflow als JSON unter ./n8n-workflows/ versioniert.
  # NUR im LAN erreichbar (kein eingehender Webhook nötig — n8n pollt ausgehend).
  # Erststart: http://<host>:5678 → Owner-Account anlegen → Workflow importieren.
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: otakupulse-n8n
    restart: unless-stopped
    env_file: ./frontend/secrets.env
    environment:
      GENERIC_TIMEZONE: Europe/Berlin
      TZ: Europe/Berlin
      # Plain-HTTP-Zugriff im LAN: sonst setzt n8n das Login-Cookie nicht.
      N8N_SECURE_COOKIE: 'false'
      N8N_RUNNERS_ENABLED: 'true'
      # Encryption-Key für gespeicherte Credentials (optional in secrets.env;
      # gesetzt = Credentials überleben einen Volume-Wechsel). Fällt sonst auf
      # einen automatisch erzeugten Key im Volume zurück.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
    ports:
      - '5678:5678'
    volumes:
      - /mnt/cache/appdata/otakupulse/n8n:/home/node/.n8n
    networks:
      - otakupulse-net

networks:
  otakupulse-net:
    name: otakupulse-net
